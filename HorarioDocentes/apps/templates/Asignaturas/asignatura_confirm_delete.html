{% extends "layouts/base-admin.html" %}

{% block title %}Eliminar Asignatura{% endblock %}

{% block content %}
<div class="container mt-5 d-flex justify-content-center">
    <div class="card shadow-lg border-0" style="max-width: 500px;">
        <div class="card-body text-center">
            <h2 class="text-danger"><i class="fas fa-exclamation-triangle"></i> Eliminar Asignatura</h2>
            <p class="mt-3 text-muted">
                ¿Estás seguro de que deseas eliminar la asignatura <strong>{{ asignatura.nombre }}</strong>?
                Esta acción no se puede deshacer.
            </p>
            <form method="POST" class="mt-4">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger btn-lg w-100 mb-2">
                    <i class="fas fa-trash-alt"></i> Eliminar Asignatura
                </button>
                <a href="{% url 'asignatura_list' %}" class="btn btn-secondary w-100">
                    <i class="fas fa-times"></i> Cancelar
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
