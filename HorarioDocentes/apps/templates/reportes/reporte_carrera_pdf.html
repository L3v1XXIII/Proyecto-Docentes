<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: DejaVu Sans, sans-serif; font-size: 12px; }
        h2 { text-align: center; color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #888; padding: 6px; text-align: center; }
        th { background-color: #f0f0f0; }
    </style>
</head>
<body>
    <h2>Reporte de Horarios - {{ carrera.nombre }}</h2>
    <table>
        <thead>
            <tr>
                <th>Materia</th>
                <th>Docente</th>
                <th>Día</th>
                <th>Hora</th>
            </tr>
        </thead>
        <tbody>
            {% for h in horarios %}
            <tr>
                <td>{{ h.materia.nombre }}</td>
                <td>{{ h.docente.nombre }} {{ h.docente.apellido_paterno }}</td>
                <td>{{ h.dia }}</td>
                <td>{{ h.hora }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
