{% extends 'layouts/base-admin.html' %}

{% block title %}Horarios Asignados{% endblock %}

{% block content %}
<link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css' rel='stylesheet' />
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 style="color: #102c54;"><i class="fas fa-calendar-alt"></i> Horarios Asignados</h2>
    <a href="{% url 'horario_create' %}" class="btn btn-success">
      <i class="fas fa-plus-circle"></i> Asignar Horario
    </a>
  </div>

  <div id='calendar'></div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var calendarEl = document.getElementById('calendar');
    var calendar = new FullCalendar.Calendar(calendarEl, {
      initialView: 'timeGridWeek',
      firstDay: 1,
      hiddenDays: [0],
      slotMinTime: '07:00:00',
      slotMaxTime: '21:00:00',
      allDaySlot: false,
      headerToolbar: {
        left: '',
        center: 'title',
        right: ''
      },
      dayHeaderFormat: { weekday: 'long' },
      events: [
        {% for e in eventos %}
        {
          title: "{{ e.title|escapejs }}",
          daysOfWeek: [{{ e.daysOfWeek.0 }}],
          startTime: "{{ e.startTime }}",
          endTime: "{{ e.endTime }}",
          extendedProps: {
            url_edit: "{{ e.url_edit }}",
            url_delete: "{{ e.url_delete }}"
          }
        },
        {% endfor %}
      ],
      eventClick: function(info) {
        Swal.fire({
          title: '¿Qué deseas hacer?',
          text: info.event.title,
          icon: 'question',
          showCancelButton: true,
          showDenyButton: true,
          confirmButtonText: 'Editar',
          denyButtonText: 'Eliminar',
          cancelButtonText: 'Cancelar'
        }).then((result) => {
          if (result.isConfirmed) {
            window.location.href = info.event.extendedProps.url_edit;
          } else if (result.isDenied) {
            Swal.fire({
              title: '¿Estás seguro?',
              text: 'Esta acción no se puede deshacer.',
              icon: 'warning',
              showCancelButton: true,
              confirmButtonText: 'Sí, eliminar',
              cancelButtonText: 'Cancelar'
            }).then((res) => {
              if (res.isConfirmed) {
                window.location.href = info.event.extendedProps.url_delete;
              }
            });
          }
        });
      }
    });
    calendar.render();
  });
</script>
{% endblock %}
