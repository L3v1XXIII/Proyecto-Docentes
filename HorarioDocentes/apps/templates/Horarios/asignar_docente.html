{% extends 'layouts/base-admin.html' %}

{% block title %}Asignar Docente a Asignatura{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2>Asignar Docente para la Asignatura: {{ asignatura.nombre }}</h2>
    <form method="post">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="docente">Seleccionar Docente:</label>
            <select name="docente" class="form-control">
                {% for docente in docentes %}
                    <option value="{{ docente.id }}">{{ docente.nombre }} {{ docente.apellido_paterno }} {{ docente.apellido_materno }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label for="horarios">Seleccionar Horarios:</label>
            <div>
                {% for horario in asignatura.horarios.all %}
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" name="horarios" value="{{ horario.id }}">
                        <label class="form-check-label">
                            {{ horario.dia }}: {{ horario.hora_inicio }} - {{ horario.hora_fin }}
                        </label>
                    </div>
                {% endfor %}
            </div>
        </div>
        
        <button type="submit" class="btn btn-primary mt-3">Asignar Docente</button>
    </form>
</div>
{% endblock %}
