{% extends 'layouts/base-docente.html' %}
{% block title %}Mi Horario{% endblock %}
{% block content %}
<link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css' rel='stylesheet' />
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>

<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 style="color: #102c54;"><i class="fas fa-calendar-check"></i> Mi Horario Asignado</h2>
    <a href="{% url 'descargar_horario_pdf' %}" class="btn btn-outline-danger">
      <i class="fas fa-file-pdf"></i> Descargar PDF
    </a>
  </div>
  <div id="calendar"></div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
      initialView: 'timeGridWeek',
      firstDay: 1,
      hiddenDays: [0],
      slotMinTime: '07:00:00',
      slotMaxTime: '21:00:00',
      allDaySlot: false,
      headerToolbar: { left: '', center: 'title', right: '' },
      events: [
        {% for e in eventos %}
        {
          title: "{{ e.title|escapejs }}",
          daysOfWeek: [{{ e.daysOfWeek.0 }}],
          startTime: "{{ e.startTime }}",
          endTime: "{{ e.endTime }}"
        },
        {% endfor %}
      ]
    });
    calendar.render();
  });
</script>
{% endblock %}
