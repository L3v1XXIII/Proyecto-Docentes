{% extends 'layouts/base-admin.html' %}

{% block title %}Confirmar Eliminación{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center vh-100" style="background-color: #6e6e6e;">
    <div class="card shadow p-4 text-center" style="max-width: 500px; border-radius: 10px;">
        <h4 class="mb-4" style="color: #102c54;">
            <i class="fas fa-exclamation-triangle text-danger"></i> Confirmar eliminación
        </h4>
        <p>¿Estás seguro que deseas eliminar el periodo <strong>{{ periodo.nombre }}</strong>?</p>

        <form method="post">
            {% csrf_token %}
            <div class="d-flex justify-content-between mt-4">
                <button type="submit" class="btn btn-danger w-50 me-2">Eliminar</button>
                <a href="{% url 'periodo_list' %}" class="btn btn-secondary w-50">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
